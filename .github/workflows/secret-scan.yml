name: Secret scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks release
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan complete Git history
        run: gitleaks git --log-opts=--all --redact=100 --no-banner --no-color --max-archive-depth=2
      - name: Scan tracked files and archives
        run: |
          mkdir -p "$RUNNER_TEMP/secret-scan-tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/secret-scan-tree"
          gitleaks dir "$RUNNER_TEMP/secret-scan-tree" --redact=100 --no-banner --no-color --max-archive-depth=2

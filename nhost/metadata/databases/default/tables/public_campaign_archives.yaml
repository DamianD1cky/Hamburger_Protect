table:
  name: campaign_archives
  schema: public
object_relationships:
- name: campaign
  using:
    foreign_key_constraint_on: campaign_id
select_permissions:
- role: user
  permission:
    columns:
    - campaign_id
    - snapshot
    - archived_by
    - archived_at
    filter:
      _and:
      - _exists:
          _table:
            schema: public
            name: gm_access
          _where:
            user_id:
              _eq: X-Hasura-User-Id
            status:
              _eq: approved
      - campaign:
          members:
            _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: gm
- role: anonymous
  permission:
    columns:
    - campaign_id
    - archived_by
    - archived_at
    filter:
      campaign:
        members:
          user_id:
            _eq: X-Hasura-User-Id

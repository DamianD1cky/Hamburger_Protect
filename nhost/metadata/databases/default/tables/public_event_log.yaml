table:
  name: event_log
  schema: public
object_relationships:
- name: campaign
  using:
    foreign_key_constraint_on: campaign_id
select_permissions:
- role: user
  permission:
    columns:
    - id
    - campaign_id
    - actor_id
    - event_type
    - entity_type
    - entity_id
    - payload
    - created_at
    filter:
      campaign:
        members:
          user_id:
            _eq: X-Hasura-User-Id
- role: anonymous
  permission:
    columns:
    - id
    - campaign_id
    - actor_id
    - event_type
    - entity_type
    - entity_id
    - payload
    - created_at
    filter:
      campaign:
        members:
          user_id:
            _eq: X-Hasura-User-Id

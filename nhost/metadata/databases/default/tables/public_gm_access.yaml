table:
  name: gm_access
  schema: public
object_relationships:
- name: user
  using:
    foreign_key_constraint_on: user_id
select_permissions:
- role: user
  permission:
    columns:
    - user_id
    - account_name
    - display_name
    - status
    - requested_at
    - reviewed_at
    - review_note
    filter:
      user_id:
        _eq: X-Hasura-User-Id

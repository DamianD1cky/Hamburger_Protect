table:
  name: quest_submissions
  schema: public
object_relationships:
- name: quest
  using:
    foreign_key_constraint_on: quest_id
select_permissions:
- role: user
  permission:
    columns:
    - id
    - quest_id
    - submitted_by
    - message
    - reviewed_by
    - approved
    - review_message
    - submitted_at
    - reviewed_at
    filter:
      _or:
      - submitted_by:
          _eq: X-Hasura-User-Id
      - quest:
          campaign:
            members:
              _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: gm
- role: anonymous
  permission:
    columns:
    - id
    - quest_id
    - submitted_by
    - message
    - reviewed_by
    - approved
    - review_message
    - submitted_at
    - reviewed_at
    filter:
      _or:
      - submitted_by:
          _eq: X-Hasura-User-Id
      - quest:
          campaign:
            members:
              _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: gm

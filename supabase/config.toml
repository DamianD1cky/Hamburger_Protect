project_id = "hamburger-protect"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:4173", "https://hamburger.damiandicky.site", "https://hamburger-protect.vercel.app"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 15
[auth.email]
enable_signup = true
enable_confirmations = false
[functions.migrate-identity]
verify_jwt = true
